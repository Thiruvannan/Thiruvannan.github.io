<head>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; }
    
    @keyframes slowDrift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body { 
      background: 
        radial-gradient(circle at 15% 20%, rgba(255, 42, 95, 0.4), transparent 50%),
        radial-gradient(circle at 85% 80%, rgba(74, 0, 224, 0.4), transparent 50%),
        radial-gradient(circle at 50% 120%, rgba(0, 210, 255, 0.3), transparent 50%),
        linear-gradient(-45deg, #09090b, #120c18, #09090b);
      background-size: 200% 200%;
      animation: slowDrift 20s ease infinite;
      background-attachment: fixed;
      color: #ffffff;
      min-height: 100vh; 
      padding: 24px 16px; 
      display: flex; 
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 0px; background: transparent; }

    #app-wrapper { 
      width: 100%; max-width: 420px; 
      view-transition-name: app-morph;
    }
    ::view-transition-old(app-morph),
    ::view-transition-new(app-morph) {
      animation-duration: 0.4s;
      animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #tracker-view { display: none; }

    @media (min-width: 1024px) {
      #app-wrapper { max-width: 1200px; display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: start; }
      #id-view { position: sticky; top: 24px; }
      #tracker-view { display: block !important; animation: none; }
      .desktop-hide { display: none !important; }
      .tracker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(48px) saturate(200%);
      -webkit-backdrop-filter: blur(48px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      border-radius: 32px;
    }

    .id-card { padding: 40px 24px; text-align: center; }
    .avatar { width: 100px; height: 100px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); margin-bottom: 20px; box-shadow: 0 12px 24px rgba(0,0,0,0.5); }
    .id-card h1 { font-size: 24px; font-weight: 800; letter-spacing: 0.2px; margin-bottom: 6px; }
    .id-card p { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 24px; font-weight: 500; }
    
    /* Increased gap to 18px to prevent misclicks */
    .btn-group { display: flex; flex-direction: column; gap: 18px; }
    .btn-link { display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 16px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.1); color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .btn-link:hover { background: rgba(255, 255, 255, 0.12); transform: scale(1.02); border-color: rgba(255, 255, 255, 0.2); }
    .btn-link:active { transform: scale(0.96); }
    .btn-tracker { background: rgba(255, 255, 255, 0.9); color: #000; border: none; font-size: 15px; font-weight: 700; box-shadow: 0 8px 16px rgba(255,255,255,0.1); }
    .btn-tracker:hover { background: #ffffff; border-color: transparent; }
    .btn-sos { background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.3); color: #fb7185; }

    /* Increased gaps in top nav */
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; gap: 12px; flex-wrap: wrap; }
    .back-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 10px 16px; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; backdrop-filter: blur(20px); }
    
    .lock-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #94a3b8; padding: 10px 14px; border-radius: 14px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(10px); transition: 0.2s; }
    .lock-btn:active { transform: scale(0.94); }
    .lock-btn.unlocked { color: #fbbf24; background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.3); }

    .undo-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fbbf24; padding: 10px 14px; border-radius: 14px; font-size: 12px; font-weight: 700; cursor: pointer; display: none; }
    .sync-status { font-size: 12px; color: #fff; font-weight: 600; display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.1); padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #34d399; box-shadow: 0 0 10px #34d399; }

    .live-slot-banner { background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.25); border-radius: 18px; padding: 12px 16px; margin-bottom: 20px; font-size: 12px; font-weight: 600; color: #7dd3fc; display: flex; align-items: center; justify-content: space-between; }

    .class-card { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 18px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 14px; }
    .class-card.current-active { border-color: rgba(56, 189, 248, 0.5); box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
    .class-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .class-code { font-size: 12px; color: rgba(255,255,255,0.6); font-weight: 600; }
    .class-name { font-size: 15px; font-weight: 800; margin-top: 4px; }
    .class-time { font-size: 11px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 12px; color: #fff; font-weight: 600; }
    
    /* Increased gap for attendance logging buttons */
    .btn-row { display: flex; gap: 16px; }
    .btn-log { flex: 1; padding: 12px; border-radius: 14px; font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .btn-log:active { transform: scale(0.94); }
    .btn-attend { background: rgba(52, 211, 153, 0.15); color: #4ade80; border-color: rgba(52, 211, 153, 0.3); }
    .btn-miss { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.3); }
    
    .logged-status { font-size: 13px; font-weight: 700; padding: 12px; border-radius: 14px; text-align: center; width: 100%; backdrop-filter: blur(10px); }
    .logged-att { background: rgba(52, 211, 153, 0.2); color: #4ade80; border: 1px solid rgba(52, 211, 153, 0.4); }
    .logged-mis { background: rgba(244, 63, 94, 0.2); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.4); }
    .logged-locked { background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.5); border: 1px dashed rgba(255,255,255,0.2); font-weight: 600; }

    .matrix-grid { display: flex; flex-direction: column; gap: 14px; }
    .matrix-card { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .matrix-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .matrix-name { font-size: 14px; font-weight: 800; }
    .matrix-perc { font-size: 18px; font-weight: 800; }
    .matrix-mid { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .matrix-stats { color: rgba(255,255,255,0.6); font-weight: 600; }
    
    .matrix-margin { font-weight: 700; padding: 4px 8px; border-radius: 8px; font-size: 11px; }
    .margin-safe { color: #4ade80; background: rgba(52, 211, 153, 0.15); border: 1px solid rgba(52,211,153,0.3); }
    .margin-danger { color: #fb7185; background: rgba(244, 63, 94, 0.15); border: 1px solid rgba(244,63,94,0.3); }
    
    /* Increased gap for surprise class buttons */
    .extra-row { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 2px; }
    .extra-label { font-size: 10px; color: rgba(255,255,255,0.5); text-transform: uppercase; font-weight: 800; }
    .extra-btns { display: flex; gap: 12px; }
    .btn-extra { padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08); color: #fff; cursor: pointer; }
    
    .safe { color: #4ade80; }
    .danger { color: #fb7185; }

    /* Emergency Modal with increased vertical gap */
    #sos-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(20px); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
    .modal-box { background: #18121a; border: 1px solid rgba(244,63,94,0.4); border-radius: 28px; padding: 28px; width: 100%; max-width: 360px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
    .modal-box div { display: flex; flex-direction: column; gap: 16px; }
  </style>
</head>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDFM_WnGNOjUNIAC6ck6eGRjAeTDvjdzJQ",
      authDomain: "srm-hub-4dc4b.firebaseapp.com",
      databaseURL: "https://srm-hub-4dc4b-default-rtdb.firebaseio.com",
      projectId: "srm-hub-4dc4b",
      storageBucket: "srm-hub-4dc4b.firebasestorage.app",
      messagingSenderId: "39200598376",
      appId: "1:39200598376:web:3e4bacf3419f92728b0edd",
      measurementId: "G-PJCGLCEP03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const countsRef = db.ref('attendance_counts');
    const logsRef = db.ref('daily_logs');

    // SECURITY SYSTEM CONFIG
    const SECRET_PIN = "5428"; // PIN requested by user
    let isEditMode = false;
    let historyStack = [];

    function triggerHaptic(type = 'light') {
      if (!navigator.vibrate) return;
      if (type === 'light') navigator.vibrate(40);
      if (type === 'success') navigator.vibrate([30, 40, 30]);
      if (type === 'undo') navigator.vibrate([60, 50]);
      if (type === 'error') navigator.vibrate([50, 100, 50, 100, 50]);
    }

    // LOCK/UNLOCK LOGIC
    function toggleEditMode() {
      const lockBtn = document.getElementById('lockToggleBtn');
      if (isEditMode) {
        // Lock it back
        isEditMode = false;
        lockBtn.innerHTML = "🔒 View Only";
        lockBtn.classList.remove('unlocked');
        triggerHaptic('light');
        document.getElementById('undoBtn').style.display = 'none';
        renderUI();
        renderMatrix();
      } else {
        // Attempt to unlock
        const pin = prompt("Enter PIN to unlock Edit Mode:");
        if (pin === SECRET_PIN) {
          isEditMode = true;
          lockBtn.innerHTML = "🔓 Edit Mode";
          lockBtn.classList.add('unlocked');
          triggerHaptic('success');
          renderUI();
          renderMatrix();
        } else if (pin !== null) {
          alert("Incorrect PIN. Access Denied.");
          triggerHaptic('error');
        }
      }
    }

    function toggleSOS(show) {
      triggerHaptic('light');
      document.getElementById('sos-modal').style.display = show ? 'flex' : 'none';
    }

    function toggleView(viewId) {
      if (window.innerWidth >= 1024) return;
      triggerHaptic('light');

      if (document.startViewTransition) {
        document.startViewTransition(() => {
          document.getElementById('id-view').style.display = viewId === 'id-view' ? 'block' : 'none';
          document.getElementById('tracker-view').style.display = viewId === 'tracker-view' ? 'block' : 'none';
          if (viewId === 'tracker-view') forceDayOrder();
        });
      } else {
        document.getElementById('id-view').style.display = viewId === 'id-view' ? 'block' : 'none';
        document.getElementById('tracker-view').style.display = viewId === 'tracker-view' ? 'block' : 'none';
        if (viewId === 'tracker-view') forceDayOrder();
      }
    }

    const baselineAttendance = {
      "26CYB1002J": { name: "CHEMISTRY FOR CS", attended: 49, conducted: 49 },
      "26BTB1001T": { name: "COMPUTATIONAL BIOLOGY", attended: 17, conducted: 17 },
      "26MEE1001L": { name: "WORKSHOP PRACTICE", attended: 44, conducted: 44 },
      "26CSE1002J": { name: "PROGRAMMING", attended: 45, conducted: 45 },
      "26MAB1001T": { name: "CALCULUS & ALGEBRA", attended: 37, conducted: 37 },
      "26LCA1006J": { name: "KOREAN", attended: 30, conducted: 33 },
      "26GNN1007J": { name: "YOGA", attended: 18, conducted: 18 }
    };

    const slots = {
      1: { str: "08:00 - 08:50", start: 480, end: 530 },
      2: { str: "08:50 - 09:40", start: 530, end: 580 },
      3: { str: "09:45 - 10:35", start: 585, end: 635 },
      4: { str: "10:40 - 11:30", start: 640, end: 690 },
      5: { str: "11:35 - 12:25", start: 695, end: 745 },
      6: { str: "12:30 - 13:20", start: 750, end: 800 },
      7: { str: "13:25 - 14:15", start: 805, end: 855 },
      8: { str: "14:20 - 15:10", start: 860, end: 910 },
      9: { str: "15:10 - 16:00", start: 910, end: 960 },
      10: { str: "16:00 - 16:50", start: 960, end: 1010 },
      11: { str: "16:50 - 17:30", start: 1010, end: 1050 }
    };

    const timetable = {
      1: { 1: "26CYB1002J", 2: "26CYB1002J", 8: "26LCA1006J", 9: "26LCA1006J" },
      2: { 1: "26CYB1002J", 2: "26CYB1002J", 3: "26LCA1006J", 4: "26BTB1001T", 7: "26CSE1002J", 8: "26CSE1002J" },
      3: { 1: "26MEE1001L", 2: "26MEE1001L", 3: "26MEE1001L", 4: "26MEE1001L", 9: "26MAB1001T" },
      4: { 1: "26MAB1001T", 2: "26MAB1001T", 3: "26CYB1002J", 4: "26CSE1002J", 7: "26GNN1007J", 8: "26GNN1007J", 9: "26GNN1007J" },
      5: { 6: "26CSE1002J", 7: "26CSE1002J", 9: "26LCA1006J", 10: "26MAB1001T" }
    };

    const academicPlanner = {
      "2026-11-02": 3, "2026-11-03": 4, "2026-11-04": 5, "2026-11-05": 1, "2026-11-06": 2,
      "2026-11-10": 4, "2026-11-11": 5, "2026-11-12": 1, "2026-11-13": 2, "2026-11-16": 3,
      "2026-11-17": 4, "2026-11-18": 5, "2026-11-19": 1, "2026-11-20": 2, "2026-11-23": 3,
      "2026-11-24": 4, "2026-11-25": 5, "2026-11-26": 1, "2026-11-27": 2, "2026-11-30": 3,
      "2026-12-01": 4, "2026-12-02": 5, "2026-12-03": 1, "2026-12-04": 2, "2026-12-07": 3
    };

    let myData = JSON.parse(JSON.stringify(baselineAttendance));
    let loggedDailyActions = {};
    let activeDayOrder = null;

    countsRef.on('value', (snapshot) => {
      if (snapshot.exists()) {
        myData = snapshot.val();
      } else {
        countsRef.set(baselineAttendance);
        myData = JSON.parse(JSON.stringify(baselineAttendance));
      }
      renderMatrix();
    });

    logsRef.on('value', (snapshot) => {
      if (snapshot.exists()) {
        loggedDailyActions = snapshot.val();
      } else {
        loggedDailyActions = {};
      }
      if (window.innerWidth >= 1024 || document.getElementById('tracker-view').style.display === 'block') {
        renderUI();
      }
    });

    if (window.innerWidth >= 1024) forceDayOrder();

    function getTodayDateStr() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const istTime = new Date(utc + (3600000 * 5.5));
      return istTime.toISOString().split('T')[0];
    }

    function getTodayDayOrder() { return academicPlanner[getTodayDateStr()] || null; }

    function forceDayOrder() {
      const val = document.getElementById("daySelector").value;
      activeDayOrder = (val === "auto") ? getTodayDayOrder() : parseInt(val);
      renderUI();
      updateDynamicIsland();
    }

    function logClass(code, slotNum, status) {
      if (!isEditMode) return;
      triggerHaptic('success');
      const today = getTodayDateStr();
      const logKey = `${today}_D${activeDayOrder}_S${slotNum}_${code}`;
      
      historyStack.push({ type: 'slot', code, slotNum, logKey, previousData: JSON.parse(JSON.stringify(myData)) });
      document.getElementById('undoBtn').style.display = 'block';

      if (!myData[code]) myData[code] = { name: code, attended: 0, conducted: 0 };

      if (status === 'attended') {
        myData[code].attended++;
        myData[code].conducted++;
      } else {
        myData[code].conducted++;
      }
      loggedDailyActions[logKey] = status;

      renderUI();
      renderMatrix();
      countsRef.set(myData);
      logsRef.child(logKey).set(status);
    }

    function logSurprise(code, status) {
      if (!isEditMode) return;
      triggerHaptic('success');
      if (!myData[code]) return;
      
      historyStack.push({ type: 'surprise', code, previousData: JSON.parse(JSON.stringify(myData)) });
      document.getElementById('undoBtn').style.display = 'block';

      if (status === 'attended') {
        myData[code].attended++;
        myData[code].conducted++;
      } else {
        myData[code].conducted++;
      }
      renderMatrix();
      countsRef.set(myData);
    }

    function undoLastAction() {
      if (historyStack.length === 0 || !isEditMode) return;
      triggerHaptic('undo');
      const last = historyStack.pop();

      myData = last.previousData;
      if (last.type === 'slot') {
        delete loggedDailyActions[last.logKey];
        logsRef.child(last.logKey).remove();
      }
      
      countsRef.set(myData);
      renderUI();
      renderMatrix();

      if (historyStack.length === 0) document.getElementById('undoBtn').style.display = 'none';
    }

    function calculateMargin(attended, conducted) {
      if (conducted === 0) return { text: "No classes yet", safe: true };
      const perc = (attended / conducted) * 100;
      if (perc >= 75) {
        const canBunk = Math.floor((attended - (0.75 * conducted)) / 0.75);
        return { text: canBunk > 0 ? `Can bunk ${canBunk}` : `0 bunks left`, safe: true };
      } else {
        const mustAttend = Math.ceil(((0.75 * conducted) - attended) / 0.25);
        return { text: `Attend ${mustAttend} to recover`, safe: false };
      }
    }

    function updateDynamicIsland() {
      const now = new Date();
      const currentMins = (now.getHours() * 60) + now.getMinutes();
      const banner = document.getElementById('slotStatusText');
      const timeRemaining = document.getElementById('slotTimeRemaining');

      if (!activeDayOrder || !timetable[activeDayOrder]) {
        banner.textContent = "No classes in session";
        timeRemaining.textContent = "";
        return;
      }

      let activeFound = false;
      for (const [slotNum, slotData] of Object.entries(slots)) {
        if (currentMins >= slotData.start && currentMins < slotData.end) {
          const code = timetable[activeDayOrder][slotNum];
          const sub = myData[code] || { name: code || "Break" };
          banner.textContent = `Live: ${sub.name}`;
          timeRemaining.textContent = `${slotData.end - currentMins}m left`;
          activeFound = true;
          break;
        }
      }

      if (!activeFound) {
        banner.textContent = "Campus Day Order " + activeDayOrder;
        timeRemaining.textContent = "Outside Hours";
      }
    }

    setInterval(updateDynamicIsland, 30000);

    function renderUI() {
      if (activeDayOrder === null) activeDayOrder = getTodayDayOrder();
      const container = document.getElementById("schedule-container");
      container.innerHTML = "";

      if (!activeDayOrder) {
        container.innerHTML = `<div class="class-card animated-card"><p style="text-align:center; color:rgba(255,255,255,0.6); font-size: 14px; font-weight:600;">No classes scheduled today.</p></div>`;
        return;
      }

      const today = getTodayDateStr();
      const dayClasses = timetable[activeDayOrder];
      let delayCounter = 0;

      for (const [slotNum, code] of Object.entries(dayClasses)) {
        const sub = myData[code] || { name: code };
        const logKey = `${today}_D${activeDayOrder}_S${slotNum}_${code}`;
        const previousAction = loggedDailyActions[logKey];

        let actionUI = '';
        if (previousAction === 'attended') {
          actionUI = `<div class="logged-status logged-att">Logged: Attended ✓</div>`;
        } else if (previousAction === 'missed') {
          actionUI = `<div class="logged-status logged-mis">Logged: Missed ✖</div>`;
        } else {
          // Conditional Rendering based on Lock Status
          if (isEditMode) {
            actionUI = `
              <div class="btn-row">
                <button class="btn-log btn-attend" type="button" onclick="logClass('${code}', '${slotNum}', 'attended')">✔ Attended</button>
                <button class="btn-log btn-miss" type="button" onclick="logClass('${code}', '${slotNum}', 'missed')">✖ Missed</button>
              </div>
            `;
          } else {
            actionUI = `<div class="logged-status logged-locked">🔒 Action Required (Unlock to Log)</div>`;
          }
        }
        
        container.innerHTML += `
          <div class="class-card animated-card" style="animation-delay: ${delayCounter * 0.05}s">
            <div class="class-header">
              <div>
                <div class="class-code">${code} (Slot ${slotNum})</div>
                <div class="class-name">${sub.name}</div>
              </div>
              <div class="class-time">${slots[slotNum].str}</div>
            </div>
            ${actionUI}
          </div>
        `;
        delayCounter++;
      }
    }

    function renderMatrix() {
      const container = document.getElementById("matrix-container");
      container.innerHTML = "";
      let delayCounter = 0;

      for (const [code, data] of Object.entries(myData)) {
        const perc = data.conducted === 0 ? 100 : ((data.attended / data.conducted) * 100).toFixed(1);
        const margin = calculateMargin(data.attended, data.conducted);
        const colorClass = perc >= 75 ? "safe" : "danger";
        const marginClass = margin.safe ? "margin-safe" : "margin-danger";

        // Only show the Surprise Class buttons if unlocked
        let extraRowUI = '';
        if (isEditMode) {
          extraRowUI = `
            <div class="extra-row">
              <span class="extra-label">Surprise Class</span>
              <div class="extra-btns">
                <button class="btn-extra" onclick="logSurprise('${code}', 'attended')">+ Attend</button>
                <button class="btn-extra" onclick="logSurprise('${code}', 'missed')">+ Miss</button>
              </div>
            </div>
          `;
        }

        container.innerHTML += `
          <div class="matrix-card animated-card" style="animation-delay: ${delayCounter * 0.05}s">
            <div class="matrix-top">
              <span class="matrix-name">${data.name}</span>
              <span class="matrix-perc ${colorClass}">${perc}%</span>
            </div>
            <div class="matrix-mid">
              <span class="matrix-stats">${data.attended} / ${data.conducted}</span>
              <span class="matrix-margin ${marginClass}">${margin.text}</span>
            </div>
            ${extraRowUI}
          </div>
        `;
        delayCounter++;
      }
    }
  </script>
</body>
</html>
