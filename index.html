  <style>

    .sync-status { font-size: 11px; color: #3fb950; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #3fb950; }

    .section-title { font-size: 14px; color: #58a6ff; font-weight: 600; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; display: flex; justify-content: space-between; align-items: center; }
    
    .class-card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
    .class-header { display: flex; justify-content: space-between; align-items: flex-start; }

    .btn-log { flex: 1; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid transparent; text-align: center; user-select: none; }
    .btn-attend { background: rgba(46, 160, 67, 0.15); color: #3fb950; border-color: rgba(46, 160, 67, 0.4); }
    .btn-miss { background: rgba(248, 81, 73, 0.15); color: #f85149; border-color: rgba(248, 81, 73, 0.4); }
    .logged-status { font-size: 12px; font-weight: 600; padding: 8px; border-radius: 6px; text-align: center; width: 100%; }
    .logged-att { background: rgba(46, 160, 67, 0.1); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.3); }
    .logged-mis { background: rgba(248, 81, 73, 0.1); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }

    .matrix-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .matrix-row { background: #161b22; border: 1px solid #30363d; padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .matrix-info { display: flex; flex-direction: column; }
    .matrix-name { font-size: 12px; font-weight: 600; color: #c9d1d9; }
    .matrix-stats { font-size: 11px; color: #8b949e; margin-top: 4px; }
    .matrix-perc { font-size: 14px; font-weight: 700; }
    .safe { color: #3fb950; }
    .danger { color: #f85149; }
    select { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d; padding: 4px 8px; border-radius: 6px; font-size: 12px; outline: none; }
  </style>
</head>

  <script>
    // --- 1. FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDFM_WnGNOjUNIAC6ck6eGRjAeTDvjdzJQ",
      authDomain: "srm-hub-4dc4b.firebaseapp.com",
      databaseURL: "https://srm-hub-4dc4b-default-rtdb.firebaseio.com",
      projectId: "srm-hub-4dc4b",
      storageBucket: "srm-hub-4dc4b.firebasestorage.app",
      messagingSenderId: "39200598376",
      appId: "1:39200598376:web:3e4bacf3419f92728b0edd",
      measurementId: "G-PJCGLCEP03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const countsRef = db.ref('attendance_counts');
    const logsRef = db.ref('daily_logs');

    // UI View Switcher
    function toggleView(viewId) {
      document.getElementById('id-view').style.display = viewId === 'id-view' ? 'block' : 'none';
      document.getElementById('tracker-view').style.display = viewId === 'tracker-view' ? 'block' : 'none';
      if(viewId === 'tracker-view') {
        forceDayOrder();
      }
    }

    // Default Baseline
    const baselineAttendance = {
      "26CYB1002J": { name: "CHEMISTRY FOR CS", attended: 49, conducted: 49 },
      "26BTB1001T": { name: "COMPUTATIONAL BIOLOGY", attended: 17, conducted: 17 },
      "26MEE1001L": { name: "WORKSHOP PRACTICE", attended: 44, conducted: 44 },
      "26CSE1002J": { name: "PROGRAMMING", attended: 45, conducted: 45 },
      "26MAB1001T": { name: "CALCULUS & ALGEBRA", attended: 37, conducted: 37 },
      "26LCA1006J": { name: "KOREAN", attended: 30, conducted: 33 },
      "26GNN1007J": { name: "YOGA", attended: 18, conducted: 18 }
    };

    const slots = {
      1: "08:00 - 08:50", 2: "08:50 - 09:40", 3: "09:45 - 10:35", 4: "10:40 - 11:30",
      5: "11:35 - 12:25", 6: "12:30 - 13:20", 7: "13:25 - 14:15", 8: "14:20 - 15:10",
      9: "15:10 - 16:00", 10: "16:00 - 16:50", 11: "16:50 - 17:30"
    };

    const timetable = {
      1: { 1: "26CYB1002J", 2: "26CYB1002J", 8: "26LCA1006J", 9: "26LCA1006J" },
      2: { 1: "26CYB1002J", 2: "26CYB1002J", 3: "26LCA1006J", 4: "26BTB1001T", 7: "26CSE1002J", 8: "26CSE1002J" },
      3: { 1: "26MEE1001L", 2: "26MEE1001L", 3: "26MEE1001L", 4: "26MEE1001L", 9: "26MAB1001T" },
      4: { 1: "26MAB1001T", 2: "26MAB1001T", 3: "26CYB1002J", 4: "26CSE1002J", 7: "26GNN1007J", 8: "26GNN1007J", 9: "26GNN1007J" },
      5: { 6: "26CSE1002J", 7: "26CSE1002J", 9: "26LCA1006J", 10: "26MAB1001T" }
    };

    const academicPlanner = {
      "2026-11-02": 3, "2026-11-03": 4, "2026-11-04": 5, "2026-11-05": 1, "2026-11-06": 2,
      "2026-11-10": 4, "2026-11-11": 5, "2026-11-12": 1, "2026-11-13": 2, "2026-11-16": 3,
      "2026-11-17": 4, "2026-11-18": 5, "2026-11-19": 1, "2026-11-20": 2, "2026-11-23": 3,
      "2026-11-24": 4, "2026-11-25": 5, "2026-11-26": 1, "2026-11-27": 2, "2026-11-30": 3,
      "2026-12-01": 4, "2026-12-02": 5, "2026-12-03": 1, "2026-12-04": 2, "2026-12-07": 3
    };

    // Deep clone baseline so we don't accidentally mutate the reference
    let myData = JSON.parse(JSON.stringify(baselineAttendance));
    let loggedDailyActions = {};
    let activeDayOrder = null;

    // --- 2. CLOUD LISTENERS ---
    countsRef.on('value', (snapshot) => {
      if (snapshot.exists()) {
        myData = snapshot.val();
      } else {
        // If DB is totally empty, seed it with the baseline
        countsRef.set(baselineAttendance);
        myData = JSON.parse(JSON.stringify(baselineAttendance));
      }
      renderMatrix(); // Always keep bottom numbers up to date
    });

    logsRef.on('value', (snapshot) => {
      if (snapshot.exists()) {
        loggedDailyActions = snapshot.val();
      } else {
        loggedDailyActions = {};
      }
      // Re-render schedule to reflect cloud state if you opened it on another device
      if(document.getElementById('tracker-view').style.display === 'block') {
         renderUI();
      }
    });

    function getTodayDateStr() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const istTime = new Date(utc + (3600000 * 5.5));
      return istTime.toISOString().split('T')[0];
    }

    function getTodayDayOrder() {
      return academicPlanner[getTodayDateStr()] || null;
    }

    function forceDayOrder() {
      const val = document.getElementById("daySelector").value;
      activeDayOrder = (val === "auto") ? getTodayDayOrder() : parseInt(val);
      renderUI();
    }

    // --- 3. INSTANT LOGGING ENGINE (Fix applied here) ---
    function logClass(code, slotNum, status) {
      const today = getTodayDateStr();
      const logKey = `${today}_D${activeDayOrder}_S${slotNum}_${code}`;

      // 1. INSTANT LOCAL MATH (Do not wait for Firebase)
      if (status === 'attended') {
        myData[code].attended++;
        myData[code].conducted++;
      } else {
        myData[code].conducted++;
      }
      loggedDailyActions[logKey] = status;

      // 2. INSTANT VISUAL UPDATE
      renderUI();
      renderMatrix();

      // 3. BACKGROUND CLOUD SYNC (Silently handles failures)
      countsRef.set(myData).catch(err => console.error("Sync Error:", err));
      logsRef.child(logKey).set(status).catch(err => console.error("Sync Error:", err));
    }

    function renderUI() {
      if (activeDayOrder === null) activeDayOrder = getTodayDayOrder();
      
      const container = document.getElementById("schedule-container");
      container.innerHTML = "";

      if (!activeDayOrder) {
        container.innerHTML = `<div class="class-card"><p style="text-align:center; color:#8b949e; font-size: 13px;">No classes scheduled today.</p></div>`;
        return;
      }

      const today = getTodayDateStr();
      const dayClasses = timetable[activeDayOrder];

      for (const [slotNum, code] of Object.entries(dayClasses)) {
        const sub = myData[code] || { name: code };
        const logKey = `${today}_D${activeDayOrder}_S${slotNum}_${code}`;
        const previousAction = loggedDailyActions[logKey];

        let actionUI = '';
        if (previousAction === 'attended') {
          actionUI = `<div class="logged-status logged-att">Logged: Attended ✓</div>`;
        } else if (previousAction === 'missed') {
          actionUI = `<div class="logged-status logged-mis">Logged: Missed ✖</div>`;
        } else {
          actionUI = `
            <div class="btn-row">
              <div class="btn-log btn-attend" onclick="logClass('${code}', '${slotNum}', 'attended')">✔ Attended</div>
              <div class="btn-log btn-miss" onclick="logClass('${code}', '${slotNum}', 'missed')">✖ Missed</div>
            </div>
          `;
        }
        
        container.innerHTML += `
          <div class="class-card
