<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiruvannan | SRM Hub</title>
  
  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    /* 1. SHINKAI TWILIGHT ATMOSPHERE */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
    body { 
      background: 
        radial-gradient(circle at 85% -10%, rgba(109, 40, 217, 0.4), transparent 45%),
        radial-gradient(circle at 10% 110%, rgba(225, 29, 72, 0.25), transparent 45%),
        linear-gradient(135deg, #06070a 0%, #130f24 50%, #080710 100%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh; 
      padding: 24px 16px; 
      display: flex; 
      justify-content: center;
    }

    /* Hide Webkit Scrollbars for cleaner glass look */
    ::-webkit-scrollbar { width: 0px; background: transparent; }

    /* 2. RESPONSIVE BENTO ARCHITECTURE */
    #app-wrapper { width: 100%; max-width: 420px; transition: 0.3s ease; }
    #tracker-view { display: none; }

    /* Desktop/Tablet Override */
    @media (min-width: 1024px) {
      #app-wrapper { max-width: 1200px; display: grid; grid-template-columns: 340px 1fr; gap: 32px; align-items: start; }
      #id-view { position: sticky; top: 24px; }
      #tracker-view { display: block !important; animation: none; }
      .desktop-hide { display: none !important; }
      .tracker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
    }

    /* 3. VISION-OS LIQUID GLASS PANELS */
    .glass-panel {
      background: rgba(20, 25, 35, 0.4);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border-radius: 24px;
    }

    /* Profile Card */
    .id-card { padding: 32px 24px; text-align: center; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); margin-bottom: 16px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
    .id-card h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    .id-card p { font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 28px; font-weight: 500; }
    
    /* Interactive Links */
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn-link { display: flex; align-items: center; justify-content: center; padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.06); color: #f8fafc; text-decoration: none; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); }
    .btn-link:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-1px); border-color: rgba(255, 255, 255, 0.15); }
    .btn-link:active { transform: scale(0.97); }
    .btn-tracker { background: rgba(52, 211, 153, 0.15); border-color: rgba(52, 211, 153, 0.3); color: #34d399; }
    .btn-tracker:hover { background: rgba(52, 211, 153, 0.25); }

    /* Tracker Header Nav */
    .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 0 4px; }
    .back-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(10px); }
    .sync-status { font-size: 12px; color: #34d399; font-weight: 600; display: flex; align-items: center; gap: 8px; background: rgba(52, 211, 153, 0.1); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(52, 211, 153, 0.2); }
    .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px #34d399; }

    /* Section Titles */
    .section-title { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 700; margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; padding: 0 4px;}
    select { background: rgba(0,0,0,0.3); color: #f8fafc; border: 1px solid rgba(255,255,255,0.1); padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; outline: none; cursor: pointer; backdrop-filter: blur(10px); }

    /* Subject/Class Cards */
    .class-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 18px; padding: 16px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 14px; transition: transform 0.2s; }
    .class-card:hover { border-color: rgba(255,255,255,0.1); background: rgba(255, 255, 255, 0.04); }
    .class-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .class-code { font-size: 11px; color: rgba(255,255,255,0.5); font-weight: 600; letter-spacing: 0.5px; }
    .class-name { font-size: 15px; font-weight: 700; color: #f8fafc; margin-top: 4px; }
    .class-time { font-size: 11px; background: rgba(0,0,0,0.4); padding: 4px 10px; border-radius: 12px; color: rgba(255,255,255,0.7); font-weight: 600; border: 1px solid rgba(255,255,255,0.05); }
    
    /* Logging Actions */
    .btn-row { display: flex; gap: 10px; }
    .btn-log { flex: 1; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1); }
    .btn-log:active { transform: scale(0.95); }
    .btn-attend { background: rgba(52, 211, 153, 0.1); color: #34d399; border-color: rgba(52, 211, 153, 0.25); }
    .btn-miss { background: rgba(244, 63, 94, 0.1); color: #f43f5e; border-color: rgba(244, 63, 94, 0.25); }
    
    .logged-status { font-size: 13px; font-weight: 700; padding: 10px; border-radius: 12px; text-align: center; width: 100%; backdrop-filter: blur(10px); }
    .logged-att { background: rgba(52, 211, 153, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
    .logged-mis { background: rgba(244, 63, 94, 0.15); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Matrix Design */
    .matrix-grid { display: flex; flex-direction: column; gap: 14px; }
    .matrix-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .matrix-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .matrix-name { font-size: 14px; font-weight: 700; color: #f8fafc; }
    .matrix-perc { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
    .matrix-mid { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .matrix-stats { color: rgba(255,255,255,0.5); font-weight: 500; }
    
    .matrix-margin { font-weight: 700; padding: 4px 8px; border-radius: 8px; font-size: 11px; }
    .margin-safe { color: #34d399; background: rgba(52, 211, 153, 0.1); border: 1px solid rgba(52,211,153,0.2); }
    .margin-danger { color: #f43f5e; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244,63,94,0.2); }
    
    .extra-row { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px; margin-top: 4px; }
    .extra-label { font-size: 10px; color: rgba(255,255,255,0.4); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .extra-btns { display: flex; gap: 8px; }
    .btn-extra { padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: #e2e8f0; cursor: pointer; transition: 0.2s; }
    .btn-extra:active { transform: scale(0.92); }
    
    .safe { color: #34d399; text-shadow: 0 0 12px rgba(52,211,153,0.4); }
    .danger { color: #f43f5e; text-shadow: 0 0 12px rgba(244,63,94,0.4); }
  </style>
</head>
<body>

  <!-- UNIVERSAL APP WRAPPER -->
  <div id="app-wrapper">

    <!-- PROFILE PANEL -->
    <div id="id-view" class="glass-panel id-card">
      <img class="avatar" src="https://github.com/Thiruvannan.png" alt="Avatar">
      <h1>Thiruvannan</h1>
      <p>Developer | SRMIST CSE</p>
      
      <div class="btn-group">
        <button class="btn-link btn-tracker desktop-hide" onclick="toggleView('tracker-view')">📊 Dashboard</button>
        <a class="btn-link" href="https://github.com/Thiruvannan" target="_blank">🐙 GitHub Profile</a>
        <a class="btn-link" href="contact.vcf">📇 Save Contact</a>
        <a class="btn-link" href="https://wa.me/919080792117?text=Hey!" target="_blank">💬 WhatsApp</a>
        <a class="btn-link" href="upi://pay?pa=9080792117@okaxis&pn=Thiruvannan&cu=INR">💸 Pay via UPI</a>
      </div>
    </div>

    <!-- TRACKER PANEL -->
    <div id="tracker-view">
      <div class="top-nav">
        <button class="back-btn desktop-hide" onclick="toggleView('id-view')">← Profile</button>
        <div class="sync-status">
          <span class="sync-dot"></span>
          <span id="syncLabel">Cloud Active</span>
        </div>
      </div>

      <!-- DESKTOP GRID SPLIT -->
      <div class="tracker-grid">
        
        <!-- LEFT COL: TODAY -->
        <div class="glass-panel" style="padding: 20px;">
          <div class="section-title">
            <span>Today's Classes</span>
            <select id="daySelector" onchange="forceDayOrder()">
              <option value="auto">Auto</option>
              <option value="1">Day 1</option>
              <option value="2">Day 2</option>
              <option value="3">Day 3</option>
              <option value="4">Day 4</option>
              <option value="5">Day 5</option>
            </select>
          </div>
          <div id="schedule-container"></div>
        </div>

        <!-- RIGHT COL: OVERALL -->
        <div class="glass-panel" style="padding: 20px;">
          <div class="section-title"><span>Overall Attendance</span></div>
          <div class="matrix-grid" id="matrix-container"></div>
        </div>

      </div>
    </div>

  </div>

  <script>
    // FIREBASE CORE (Untouched logic, flawless operation)
    const firebaseConfig = {
      apiKey: "AIzaSyDFM_WnGNOjUNIAC6ck6eGRjAeTDvjdzJQ",
      authDomain: "srm-hub-4dc4b.firebaseapp.com",
      databaseURL: "https://srm-hub-4dc4b-default-rtdb.firebaseio.com",
      projectId: "srm-hub-4dc4b",
      storageBucket: "srm-hub-4dc4b.firebasestorage.app",
      messagingSenderId: "39200598376",
      appId: "1:39200598376:web:3e4bacf3419f92728b0edd",
      measurementId: "G-PJCGLCEP03"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const countsRef = db.ref('attendance_counts');
    const logsRef = db.ref('daily_logs');

    // UI View Switcher (Mobile Only)
    function toggleView(viewId) {
      if (window.innerWidth >= 1024) return; // Ignore on desktop
      document.getElementById('id-view').style.display = viewId === 'id-view' ? 'block' : 'none';
      document.getElementById('tracker-view').style.display = viewId === 'tracker-view' ? 'block' : 'none';
      if (viewId === 'tracker-view') forceDayOrder();
    }

    const baselineAttendance = {
      "26CYB1002J": { name: "CHEMISTRY FOR CS", attended: 49, conducted: 49 },
      "26BTB1001T": { name: "COMPUTATIONAL BIOLOGY", attended: 17, conducted: 17 },
      "26MEE1001L": { name: "WORKSHOP PRACTICE", attended: 44, conducted: 44 },
      "26CSE1002J": { name: "PROGRAMMING", attended: 45, conducted: 45 },
      "26MAB1001T": { name: "CALCULUS & ALGEBRA", attended: 37, conducted: 37 },
      "26LCA1006J": { name: "KOREAN", attended: 30, conducted: 33 },
      "26GNN1007J": { name: "YOGA", attended: 18, conducted: 18 }
    };

    const slots = {
      1: "08:00 - 08:50", 2: "08:50 - 09:40", 3: "09:45 - 10:35", 4: "10:40 - 11:30",
      5: "11:35 - 12:25", 6: "12:30 - 13:20", 7: "13:25 - 14:15", 8: "14:20 - 15:10",
      9: "15:10 - 16:00", 10: "16:00 - 16:50", 11: "16:50 - 17:30"
    };

    const timetable = {
      1: { 1: "26CYB1002J", 2: "26CYB1002J", 8: "26LCA1006J", 9: "26LCA1006J" },
      2: { 1: "26CYB1002J", 2: "26CYB1002J", 3: "26LCA1006J", 4: "26BTB1001T", 7: "26CSE1002J", 8: "26CSE1002J" },
      3: { 1: "26MEE1001L", 2: "26MEE1001L", 3: "26MEE1001L", 4: "26MEE1001L", 9: "26MAB1001T" },
      4: { 1: "26MAB1001T", 2: "26MAB1001T", 3: "26CYB1002J", 4: "26CSE1002J", 7: "26GNN1007J", 8: "26GNN1007J", 9: "26GNN1007J" },
      5: { 6: "26CSE1002J", 7: "26CSE1002J", 9: "26LCA1006J", 10: "26MAB1001T" }
    };

    const academicPlanner = {
      "2026-11-02": 3, "2026-11-03": 4, "2026-11-04": 5, "2026-11-05": 1, "2026-11-06": 2,
      "2026-11-10": 4, "2026-11-11": 5, "2026-11-12": 1, "2026-11-13": 2, "2026-11-16": 3,
      "2026-11-17": 4, "2026-11-18": 5, "2026-11-19": 1, "2026-11-20": 2, "2026-11-23": 3,
      "2026-11-24": 4, "2026-11-25": 5, "2026-11-26": 1, "2026-11-27": 2, "2026-11-30": 3,
      "2026-12-01": 4, "2026-12-02": 5, "2026-12-03": 1, "2026-12-04": 2, "2026-12-07": 3
    };

    let myData = JSON.parse(JSON.stringify(baselineAttendance));
    let loggedDailyActions = {};
    let activeDayOrder = null;

    countsRef.on('value', (snapshot) => {
      if (snapshot.exists()) {
        myData = snapshot.val();
      } else {
        countsRef.set(baselineAttendance);
        myData = JSON.parse(JSON.stringify(baselineAttendance));
      }
      renderMatrix();
    });

    logsRef.on('value', (snapshot) => {
      if (snapshot.exists()) {
        loggedDailyActions = snapshot.val();
      } else {
        loggedDailyActions = {};
      }
      if (window.innerWidth >= 1024 || document.getElementById('tracker-view').style.display === 'block') {
        renderUI();
      }
    });

    // Boot-up for desktop width
    if (window.innerWidth >= 1024) forceDayOrder();

    function getTodayDateStr() {
      const now = new Date();
      const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      const istTime = new Date(utc + (3600000 * 5.5));
      return istTime.toISOString().split('T')[0];
    }

    function getTodayDayOrder() { return academicPlanner[getTodayDateStr()] || null; }

    function forceDayOrder() {
      const val = document.getElementById("daySelector").value;
      activeDayOrder = (val === "auto") ? getTodayDayOrder() : parseInt(val);
      renderUI();
    }

    function logClass(code, slotNum, status) {
      const today = getTodayDateStr();
      const logKey = `${today}_D${activeDayOrder}_S${slotNum}_${code}`;
      if (!myData[code]) myData[code] = { name: code, attended: 0, conducted: 0 };

      if (status === 'attended') {
        myData[code].attended++;
        myData[code].conducted++;
      } else {
        myData[code].conducted++;
      }
      loggedDailyActions[logKey] = status;

      renderUI();
      renderMatrix();
      countsRef.set(myData).catch(err => console.error(err));
      logsRef.child(logKey).set(status).catch(err => console.error(err));
    }

    function logSurprise(code, status) {
      if (!myData[code]) return;
      if (status === 'attended') {
        myData[code].attended++;
        myData[code].conducted++;
      } else {
        myData[code].conducted++;
      }
      renderMatrix();
      countsRef.set(myData).catch(err => console.error(err));
    }

    function calculateMargin(attended, conducted) {
      if (conducted === 0) return { text: "No classes yet", safe: true };
      const perc = (attended / conducted) * 100;
      if (perc >= 75) {
        const canBunk = Math.floor((attended - (0.75 * conducted)) / 0.75);
        return { text: canBunk > 0 ? `Can bunk ${canBunk}` : `0 bunks left`, safe: true };
      } else {
        const mustAttend = Math.ceil(((0.75 * conducted) - attended) / 0.25);
        return { text: `Attend ${mustAttend} to recover`, safe: false };
      }
    }

    function renderUI() {
      if (activeDayOrder === null) activeDayOrder = getTodayDayOrder();
      const container = document.getElementById("schedule-container");
      container.innerHTML = "";

      if (!activeDayOrder) {
        container.innerHTML = `<div class="class-card"><p style="text-align:center; color:rgba(255,255,255,0.5); font-size: 13px;">No classes scheduled today.</p></div>`;
        return;
      }

      const today = getTodayDateStr();
      const dayClasses = timetable[activeDayOrder];

      for (const [slotNum, code] of Object.entries(dayClasses)) {
        const sub = myData[code] || { name: code };
        const logKey = `${today}_D${activeDayOrder}_S${slotNum}_${code}`;
        const previousAction = loggedDailyActions[logKey];

        let actionUI = '';
        if (previousAction === 'attended') {
          actionUI = `<div class="logged-status logged-att">Logged: Attended ✓</div>`;
        } else if (previousAction === 'missed') {
          actionUI = `<div class="logged-status logged-mis">Logged: Missed ✖</div>`;
        } else {
          actionUI = `
            <div class="btn-row">
              <button class="btn-log btn-attend" type="button" onclick="logClass('${code}', '${slotNum}', 'attended')">✔ Attended</button>
              <button class="btn-log btn-miss" type="button" onclick="logClass('${code}', '${slotNum}', 'missed')">✖ Missed</button>
            </div>
          `;
        }
        
        container.innerHTML += `
          <div class="class-card">
            <div class="class-header">
              <div>
                <div class="class-code">${code} (Slot ${slotNum})</div>
                <div class="class-name">${sub.name}</div>
              </div>
              <div class="class-time">${slots[slotNum]}</div>
            </div>
            ${actionUI}
          </div>
        `;
      }
    }

    function renderMatrix() {
      const container = document.getElementById("matrix-container");
      container.innerHTML = "";

      for (const [code, data] of Object.entries(myData)) {
        const perc = data.conducted === 0 ? 100 : ((data.attended / data.conducted) * 100).toFixed(1);
        const margin = calculateMargin(data.attended, data.conducted);
        const colorClass = perc >= 75 ? "safe" : "danger";
        const marginClass = margin.safe ? "margin-safe" : "margin-danger";

        container.innerHTML += `
          <div class="matrix-card">
            <div class="matrix-top">
              <span class="matrix-name">${data.name}</span>
              <span class="matrix-perc ${colorClass}">${perc}%</span>
            </div>
            <div class="matrix-mid">
              <span class="matrix-stats">${data.attended} / ${data.conducted}</span>
              <span class="matrix-margin ${marginClass}">${margin.text}</span>
            </div>
            <div class="extra-row">
              <span class="extra-label">Surprise Class</span>
              <div class="extra-btns">
                <button class="btn-extra" onclick="logSurprise('${code}', 'attended')">+ Attend</button>
                <button class="btn-extra" onclick="logSurprise('${code}', 'missed')">+ Miss</button>
              </div>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
