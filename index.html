<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiruvannan | Dev Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; width: 100%; max-width: 380px; padding: 28px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .avatar { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #58a6ff; margin-bottom: 14px; }
    h1 { font-size: 20px; color: #f0f6fc; margin-bottom: 4px; }
    p.bio { font-size: 13px; color: #8b949e; margin-bottom: 22px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 16px; border-radius: 10px; background: #21262d; border: 1px solid #30363d; color: #f0f6fc; text-decoration: none; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.2s ease; }
    .btn:hover { background: #30363d; border-color: #8b949e; }
    
    .btn-vcard { background: #1f6feb; border-color: #388bfd; }
    .btn-vcard:hover { background: #388bfd; }
    .btn-upi { background: #000000; border-color: #333333; }
    .btn-upi:hover { background: #1a1a1a; }
    .btn-wifi { background: #8957e5; border-color: #9d6cfa; }
    .btn-wifi:hover { background: #9d6cfa; }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://github.com/Thiruvannan.png" alt="Profile Avatar">
    <h1>Thiruvannan</h1>
    <p class="bio">Developer & Tech Enthusiast</p>

    <div class="btn-group">
      <!-- 1. Contact Save -->
      <a class="btn btn-vcard" href="contact.vcf">📇 Save Contact to Phone</a>

      <!-- 2. UPI Payment (REPLACE YOUR_UPI_ID HERE) -->
      <a class="btn btn-upi" href="upi://pay?pa=YOUR_UPI_ID@bank&pn=Thiruvannan&cu=INR">💸 Pay via UPI</a>

      <!-- 3. Copy Hotspot Password -->
      <button class="btn btn-wifi" id="wifiBtn" onclick="copyWifi()">📶 Copy Hotspot Password</button>

      <!-- 4. GitHub & WhatsApp -->
      <a class="btn" href="https://github.com/Thiruvannan" target="_blank">🐙 View GitHub Profile</a>
      <a class="btn" href="https://wa.me/919080792117?text=Hey!" target="_blank">💬 Chat on WhatsApp</a>
    </div>
  </div>

  <script>
    function copyWifi() {
      // Replace 'YourSecretPassword' with your actual phone hotspot password
      navigator.clipboard.writeText("YourSecretPassword").then(() => {
        const btn = document.getElementById("wifiBtn");
        btn.innerText = "✅ Password Copied!";
        btn.style.background = "#238636";
        btn.style.borderColor = "#2ea043";
        
        // Reset button after 3 seconds
        setTimeout(() => {
          btn.innerText = "📶 Copy Hotspot Password";
          btn.style.background = "#8957e5";
          btn.style.borderColor = "#9d6cfa";
        }, 3000);
      });
    }
  </script>
</body>
</html>
