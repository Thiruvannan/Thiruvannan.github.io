<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thiruvannan | Dev Profile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 16px; width: 100%; max-width: 380px; padding: 28px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .avatar { width: 84px; height: 84px; border-radius: 50%; border: 2px solid #58a6ff; margin-bottom: 14px; }
    h1 { font-size: 20px; color: #f0f6fc; margin-bottom: 4px; }
    p.bio { font-size: 13px; color: #8b949e; margin-bottom: 22px; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 13px 16px; border-radius: 10px; background: #21262d; border: 1px solid #30363d; color: #f0f6fc; text-decoration: none; font-weight: 500; font-size: 14px; cursor: pointer; transition: 0.2s ease; }
    .btn:hover { background: #30363d; border-color: #8b949e; }
    .btn-vcard { background: #1f6feb; border-color: #388bfd; }
    .btn-vcard:hover { background: #388bfd; }
    .btn-github { background: #238636; border-color: #2ea043; }
    .btn-github:hover { background: #2ea043; }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://github.com/Thiruvannan.png" alt="Profile Avatar">
    <h1>Thiruvannan</h1>
    <p class="bio">Developer & Tech Enthusiast</p>

    <div class="btn-group">
      <!-- Direct Contact Insertion (No Download) -->
      <button class="btn btn-vcard" onclick="addContact()">📇 Save Contact to Phone</button>
      <a class="btn btn-github" href="https://github.com/Thiruvannan" target="_blank">🐙 View GitHub Profile</a>
      <a class="btn" href="https://wa.me/919080792117?text=Hey!" target="_blank">💬 Chat on WhatsApp</a>
    </div>
  </div>

  <script>
    function addContact() {
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      if (isIOS) {
        // iOS Safari automatically prompts to save contacts without saving a loose file
        window.location.href = 'contact.vcf';
      } else {
        // Android intent: opens native contact creation screen directly
        window.location.href = 'intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;S.name=Thiruvannan;S.phone=%2B919080792117;S.company=SRMIST;end';
      }
    }
  </script>
</body>
</html>
